spring.config.import=optional:file:.env[.properties]

spring.application.name=oficial

#DataBases
spring.datasource.url=${KEY_URL_DB}
spring.datasource.username=${KEY_USERNAME}
spring.datasource.password=${KEY_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialec=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB